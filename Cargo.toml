[package]
name = "trumpet-quiz-dioxus"
version = "0.1.0"
authors = ["Clinton Bowen <clinton.bowen@gmail.com>"]
edition = "2021"

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"

[features]
default = ["web"]
web = ["dioxus/web"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
